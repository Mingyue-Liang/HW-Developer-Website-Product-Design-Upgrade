  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;

.btn.viz-tile {

a.btn {

}

.btn:not(:disabled):hover {

    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {

}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)

}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,

}

.viz-carousel-controls &gt; button::before,

}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  font-family: var(--font-sans);
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: calc(4px + var(--control-spacing, 12px) / 2);
  border-color: var(--input);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--popover) 96%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1.4285714286;
}
.form-control:is(
  [type=&quot;file&quot;],
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;],
  [type=&quot;color&quot;]
) {
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  line-height: 18px;
}
.form-control:is(
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;]
) {
  padding-inline: var(--control-spacing, 12px);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
  padding: 0;
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
  min-height: calc(10px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  margin-inline-end: var(--control-spacing, 12px);
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: calc(12px + 2 * var(--control-spacing, 12px));
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);

textarea.form-control {
  height: auto;
  resize: vertical;
  min-height: 96px;
  padding: 8px 10px;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: none;
}
.form-control:disabled {
  color: var(--muted-foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  opacity: 1;
}
.form-control[aria-invalid=&quot;true&quot;] {
  border-color: var(--red);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 20%, transparent);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  margin: 0;
  /* The secondary icon role is 14px at compact density and 16px at web density. */
  --icon-size: calc(10px + var(--control-spacing, 12px) / 2);
  /* Settings dropdowns retain a 12px inset and a 4px text-to-chevron gap. */
  padding: 0 calc(16px + var(--icon-size)) 0 12px;
  outline: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(
      45deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    ),
    linear-gradient(
      135deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    );
  background-position:
    calc(100% - 12px - var(--icon-size) / 2) 50%,
    calc(100% - 12px - var(--icon-size) * 0.18) 50%;
  background-repeat: no-repeat;
  background-size: calc(var(--icon-size) * 0.32) calc(var(--icon-size) * 0.32);
  cursor: var(--cursor-interaction, default);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.form-select option {
  color: var(--popover-foreground);
  background-color: var(--popover);
}

.form-select:not(:disabled):hover {
  background-color: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.form-select:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}
.form-select:disabled {
  opacity: 0.4;
}

.form-check {
  display: flex;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  corner-shape: round;
  box-shadow: var(--shadow-sm);
  position: relative;
  width: calc(10px + var(--control-spacing, 12px) / 2);
  height: calc(10px + var(--control-spacing, 12px) / 2);
  border-color: var(--border-strong, var(--input));
  border-radius: calc(var(--radius-sm) / 2);
  background-color: transparent;
  color: var(--foreground);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:is(:checked, :indeterminate) {
  border-color: var(--border-strong, var(--input));
  background-color: color-mix(in srgb, var(--popover) 96%, transparent);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;

  const hostStyles = document.getElementById(&quot;codex-visualization-host-theme&quot;);
  const hostStyle = hostStyles.sheet.cssRules[0].style;
  // Typography, geometry and interaction cursors still follow the host.
  const styleForProperty = (property) =&gt;
    /^--(?:font-|radius|corner-shape$|control-spacing$|cursor-interaction$|icon-size$|visualize-paint-gutter$)/.test(property)
      ? document.documentElement.style
      : hostStyle;
  const initialGlobals =
    globalThis.__codexVisualizationInitialGlobals ?? globalThis.openai;
  delete globalThis.__codexVisualizationInitialGlobals;
  if (initialGlobals?.statePersistence != null) {
    globalThis.openai ??= {};
    globalThis.openai.statePersistence = initialGlobals.statePersistence;
    globalThis.openai.stateModelContext = initialGlobals.stateModelContext ?? &quot;none&quot;;
  }
  if (!true) {
    return;
  }
  let appliedProperties = [];
  const applyHostStyleVariables = (styleVariables) =&gt; {
    if (styleVariables == null || typeof styleVariables !== &quot;object&quot;) {
      return;
    }
    for (const property of appliedProperties) {
      styleForProperty(property).removeProperty(property);
    }
    appliedProperties = [];
    for (const [property, value] of Object.entries(styleVariables)) {
      if (property.startsWith(&quot;--&quot;) &amp;&amp; typeof value === &quot;string&quot;) {
        styleForProperty(property).setProperty(property, value);
        appliedProperties.push(property);
      }
    }
  };

  const syncHostStyles = (globals) =&gt; {
    applyHostStyleVariables(globals?.visualizationStyleVariables);
    const sandboxDocument = globalThis.frameElement?.ownerDocument;
    if (sandboxDocument != null &amp;&amp; globals?.visualizationTheme != null) {
      let colorSchemeMeta = sandboxDocument.querySelector(
        'meta[name=&quot;color-scheme&quot;]',
      );
      if (colorSchemeMeta == null) {
        colorSchemeMeta = sandboxDocument.createElement(&quot;meta&quot;);
        colorSchemeMeta.name = &quot;color-scheme&quot;;
        sandboxDocument.head.appendChild(colorSchemeMeta);
      }
      colorSchemeMeta.content = globals.visualizationTheme;
      sandboxDocument.documentElement.style.colorScheme =
        globals.visualizationTheme;

      sandboxDocument.documentElement.style.backgroundColor =
        hostStyle.getPropertyValue(&quot;--background&quot;);

          &lt;p class=&quot;h-article-body&quot;&gt;目前已上线 HarmonyOS 应用开发者能力认证、应用市场增长优化师认证等证书，助力开发者职业进阶。&lt;/p&gt;
          &lt;div class=&quot;h-ime-article&quot; hidden&gt;&lt;h2&gt;适用场景&lt;/h2&gt;&lt;p&gt;IME Kit 用于连接应用中的编辑框与输入法应用。开发者可据此开发输入法应用、自绘编辑框，或在应用中管理软键盘的显示与切换。&lt;/p&gt;&lt;h2&gt;能力与 API&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;输入法服务：&lt;/strong&gt;面向输入法应用，涉及软键盘面板、文本插入与删除、选区及输入事件。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;输入法框架：&lt;/strong&gt;面向使用输入法的应用或自绘编辑框，负责绑定输入法并处理输入、光标与键盘控制。&lt;/p&gt;&lt;h2&gt;IME Kit API参考&lt;/h2&gt;&lt;p&gt;常见入口包括 &lt;code&gt;inputMethodEngine&lt;/code&gt;、&lt;code&gt;inputMethod&lt;/code&gt;、&lt;code&gt;InputMethodExtensionAbility&lt;/code&gt;、&lt;code&gt;InputMethodExtensionContext&lt;/code&gt; 与 &lt;code&gt;Panel&lt;/code&gt;。具体接口的起始版本、支持设备及调用条件应以对应 API 页面为准。&lt;/p&gt;&lt;p class=&quot;h-article-note&quot;&gt;这里呈现的是用于交互演示的文章要点，不替代华为开发者文档的完整原文。&lt;a class=&quot;h-source-link&quot; href=&quot;https://developer.huawei.com/consumer/cn/doc/doccenter-capabilities/ime-kit-intro#ime-kit-api%E5%8F%82%E8%80%83&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;查看完整原文 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
          &lt;p class=&quot;h-article-note h-default-note&quot;&gt;此处仅展示截图中可见的文章摘要，用于演示 AI 助手与当前内容关联后的阅读体验。&lt;/p&gt;
        &lt;/article&gt;
      &lt;/main&gt;

&lt;script&gt;
(()=&gt;{
  const root=document.getElementById('harmony-ai-prototype');
  const shell=root.querySelector('.h-shell');
  const home=root.querySelector('.h-home');
  const main=root.querySelector('.h-main');
  const searchOverlay=root.querySelector('.h-search-overlay');
  const searchInput=root.querySelector('.h-search-input');
  const article=root.querySelector('.h-article-view');
  const results=root.querySelector('.h-results-view');
  const content=root.querySelector('.h-assistant-content');
  const contextTitle=root.querySelector('.h-context-title');
  const contextDesc=root.querySelector('.h-context-desc');
  const articleTitle=root.querySelector('.h-article-title');
  const articleShort=root.querySelector('.h-article-short');
  const articleLead=root.querySelector('.h-article-lead');
  const articleBody=root.querySelector('.h-article-body');
  const imeArticle=root.querySelector('.h-ime-article');
  const defaultNote=root.querySelector('.h-default-note');
  const queryTitle=root.querySelector('.h-query-title');
  const resultCount=root.querySelector('.h-count');
  const certResults=root.querySelector('.h-cert-results');
  const imeResults=root.querySelector('.h-ime-results');
  const question=root.querySelector('.h-question');
  const mic=root.querySelector('.h-mic');
  const live=root.querySelector('.h-live');
  const liveLabel=root.querySelector('.h-live-label');
  const liveCaption=root.querySelector('.h-live-caption');
  const liveAnswer=root.querySelector('.h-live-answer');
  const livePage=root.querySelector('.h-live-page');
  const liveContext=root.querySelector('.h-live-context');
  const pauseButton=root.querySelector('.h-live-pause');
  const pages={
    cert:{title:'开发者能力认证',lead:'华为开发者联盟学堂涵盖丰富的 HarmonyOS 课程及不同业务场景认证考试。',body:'目前已上线 HarmonyOS 应用开发者能力认证、应用市场增长优化师认证等证书，助力开发者职业进阶。',summary:'这篇内容介绍了华为开发者联盟学堂的 HarmonyOS 课程与业务场景认证考试，并提到应用开发者能力认证、应用市场增长优化师认证等证书。'},
    biometric:{title:'开通生物特征认证能力',lead:'查询认证能力是否支持，以及相关开发接口与设备安全服务说明。',body:'搜索结果指向生物特征认证能力的使用说明。打开完整文档后，助手可继续结合正文定位前置条件和接口示例。',summary:'当前可见的搜索摘要涉及生物特征认证能力查询、相关接口和设备安全服务。完整条件需要以文章正文为准。'},
    prepare:{title:'应用开发准备',lead:'在开始应用开发前，需要先完成开发者注册与实名认证。',body:'完成注册与实名认证后，可使用联盟开放的各类能力和服务。',summary:'文章摘要提示先完成开发者注册与实名认证，再使用联盟开放的能力和服务。'},
    ime:{title:'IME Kit简介',lead:'IME Kit 建立应用编辑框与输入法应用之间的通信通道，帮助开发者构建输入法和自绘编辑框等能力。',body:'本文介绍 IME Kit 的适用场景、输入法服务与输入法框架的能力边界，并汇集相关 API 入口。',summary:'IME Kit 连接编辑框与输入法应用。开发者可根据场景选择输入法服务、输入法框架，以及相应的 ExtensionAbility 和 Panel 接口。'}
  };
  let current=null;
  let activeQuery='开发者能力认证';
  const imeResponses={
    fit:['我的需求适合用 IME Kit 吗？','如果要开发输入法本身，重点看输入法服务；如果要让自绘编辑框接入输入法，重点看输入法框架；普通应用控制软键盘则查看 inputMethod 的相关接口。依据：本文“适用场景”“能力与 API”。'],
    api:['我该选哪个 API？','inputMethodEngine 面向输入法服务侧；inputMethod 面向使用或控制输入法的应用侧；InputMethodExtensionAbility 是输入法应用的扩展能力入口。具体方法、权限与版本请继续核对对应 API 页面。依据：本文“IME Kit API参考”。'],
    start:['如何从零实现一个最简单的输入法？','可先创建 InputMethodExtensionAbility，再建立键盘面板、监听输入会话，最后通过输入法服务接口处理文本输入。具体工程配置与代码应继续参照“实现一个输入法应用”开发指南。依据：本文“适用场景”“IME Kit API参考”。'],
    compat:['使用前要确认哪些兼容性条件？','先确认目标设备、系统与 API 版本，再逐项查看所选接口的起始版本、权限和调用约束。本文是能力概览，不足以单独判断某一接口在你的设备上是否可用。依据：对应 API 参考页面。'],
    panel:['固定键盘和悬浮键盘怎么选？','先按产品场景选择面板形态，再核对 Panel 接口支持的类型、尺寸与位置控制能力。具体实现应以对应版本的 Panel API 说明为准。依据：本文“能力与 API”。'],
    focus:['焦点、光标或键盘显示异常怎么排查？','先检查编辑框与输入法是否正确绑定、焦点是否进入目标控件、光标和选区更新是否同步，以及键盘显示/隐藏调用时机。依据：本文“能力与 API”及相关开发指南。'],
    example:['对应的 API 和示例代码在哪里？','从本文“IME Kit API参考”进入 inputMethodEngine、inputMethod、InputMethodExtensionAbility 等接口页；完整实现路径可接着看“实现一个输入法应用”或“在自绘编辑框中使用输入法”。']
  };
  function resetAssistant(){contextTitle.textContent='搜索：'+activeQuery;contextDesc.textContent='打开文章后，助手会自动关联当前页面，提供针对性辅助阅读。';content.innerHTML='&lt;div class=&quot;h-welcome&quot;&gt;&lt;strong&gt;可以帮你做什么？&lt;/strong&gt;&lt;p&gt;基于搜索结果继续提问，或打开一篇文章开始辅助阅读。&lt;/p&gt;&lt;/div&gt;'}
  function openSearch(){searchOverlay.hidden=false;searchInput.focus();searchInput.select()}
  function closeSearch(){searchOverlay.hidden=true}
  function showResults(){
    closeSearch();home.hidden=true;main.hidden=false;shell.classList.remove('h-closed');
    const isIme=/\bime\b|输入法/i.test(searchInput.value);
    activeQuery=isIme?'IME Kit简介':'开发者能力认证';
    queryTitle.textContent=activeQuery;resultCount.textContent='找到全部相关内容：'+(isIme?'2':'85');
    certResults.hidden=isIme;imeResults.hidden=!isIme;
    root.querySelector('.h-searchmini').firstChild.textContent=activeQuery+' ';
    current=null;article.hidden=true;results.hidden=false;resetAssistant();
    updateLivePage();
  }
  root.querySelector('.h-searchmini').addEventListener('click',openSearch);
  root.querySelector('.h-brand').addEventListener('click',()=&gt;{stopVoice(false);closeSearch();main.hidden=true;home.hidden=false;shell.classList.remove('h-closed')});
  root.querySelector('.h-ai-search-trigger').addEventListener('click',showResults);
  root.querySelector('.h-ai-prompt').addEventListener('click',showResults);
  root.querySelector('.h-searchbtn').addEventListener('click',()=&gt;{searchInput.value=activeQuery;openSearch()});
  root.querySelector('.h-clear').addEventListener('click',()=&gt;{searchInput.value='';openSearch()});
  searchInput.addEventListener('keydown',e=&gt;{if(e.key==='Enter')showResults();if(e.key==='Escape')closeSearch()});
  root.querySelector('.h-search-clear').addEventListener('click',()=&gt;{searchInput.value='';searchInput.focus()});
  root.querySelectorAll('.h-history button,.h-hot-grid button').forEach(b=&gt;b.addEventListener('click',()=&gt;{searchInput.value=b.textContent.replace(/^\d\s*/,'').trim();searchInput.focus()}));
  root.querySelector('.h-clear-history').addEventListener('click',()=&gt;{root.querySelector('.h-history').hidden=true});
  searchOverlay.addEventListener('click',e=&gt;{if(e.target===searchOverlay)closeSearch()});
  function renderArticleAssistant(){
    const p=pages[current];
    contextTitle.textContent='正在阅读：'+p.title;
    contextDesc.textContent='已关联当前文章；回答会优先依据本页内容，并标明可核对的段落。';
    content.innerHTML=current==='ime'?'&lt;strong&gt;围绕 IME Kit 继续阅读&lt;/strong&gt;&lt;p&gt;可以从下面的问题开始，答案会标出对应章节。&lt;/p&gt;&lt;div class=&quot;h-ime-prompts&quot;&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;fit&quot;&gt;我的需求适合用 IME Kit 吗？&lt;/button&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;api&quot;&gt;我该选哪个 API？&lt;/button&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;start&quot;&gt;如何从零实现一个最简单的输入法？&lt;/button&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;compat&quot;&gt;使用前要确认哪些兼容性条件？&lt;/button&gt;&lt;/div&gt;&lt;strong class=&quot;h-followup-heading&quot;&gt;继续深入&lt;/strong&gt;&lt;div class=&quot;h-ime-prompts h-ime-followups&quot;&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;panel&quot;&gt;固定键盘和悬浮键盘怎么选？&lt;/button&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;focus&quot;&gt;焦点、光标或键盘显示异常怎么排查？&lt;/button&gt;&lt;button type=&quot;button&quot; data-ime-question=&quot;example&quot;&gt;对应的 API 和示例代码在哪里？&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;h-answer&quot; hidden&gt;&lt;/div&gt;':'&lt;strong&gt;围绕这篇文章阅读&lt;/strong&gt;&lt;div class=&quot;h-actions&quot;&gt;&lt;button type=&quot;button&quot; data-help=&quot;summary&quot;&gt;汇总文章&lt;/button&gt;&lt;button type=&quot;button&quot; data-help=&quot;question&quot;&gt;就本文提问&lt;/button&gt;&lt;button type=&quot;button&quot; data-help=&quot;context&quot;&gt;衔接上下文&lt;/button&gt;&lt;button type=&quot;button&quot; data-help=&quot;locate&quot;&gt;定位相关段落&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;h-answer&quot;&gt;&lt;strong&gt;阅读提示&lt;/strong&gt;&lt;p&gt;你可以从摘要开始，或直接问与当前文章相关的问题。&lt;/p&gt;&lt;/div&gt;';
  }
  root.querySelectorAll('.h-open-article').forEach(b=&gt;b.addEventListener('click',()=&gt;{
    current=b.dataset.article;const p=pages[current];
    articleTitle.textContent=p.title;articleShort.textContent=p.title;articleLead.textContent=p.lead;articleBody.textContent=p.body;
    imeArticle.hidden=current!=='ime';defaultNote.hidden=current==='ime';
    results.hidden=true;article.hidden=false;shell.classList.remove('h-closed');renderArticleAssistant();updateLivePage();
  }));
  root.querySelector('.h-back').addEventListener('click',()=&gt;{current=null;article.hidden=true;results.hidden=false;resetAssistant();updateLivePage();});
  root.querySelector('.h-nav-ai').addEventListener('click',()=&gt;{if(home.hidden){shell.classList.toggle('h-closed')}else showResults()});
  root.querySelector('.h-collapse').addEventListener('click',()=&gt;shell.classList.add('h-closed'));
  content.addEventListener('click',e=&gt;{
    const prompt=e.target.closest('[data-ime-question]');
    if(prompt&amp;&amp;current==='ime'){const [title,body]=imeResponses[prompt.dataset.imeQuestion];showAnswer(title,body);return}
    const b=e.target.closest('[data-help]');if(!b||!current)return;
    const p=pages[current];const answer=content.querySelector('.h-answer');
    const responses={summary:['文章摘要',p.summary],question:['就本文提问','试着问：“这篇文章提到哪些认证？”或输入你关心的条件。'],context:['上下文衔接','当前文章来自“开发者能力认证”的搜索结果。若要继续了解申请步骤或前置条件，可查看关联文档，并用当前文章内容继续追问。'],locate:['相关段落','已定位到“内容概览”：'+p.body]};
    const [title,body]=responses[b.dataset.help];answer.innerHTML='&lt;strong&gt;&lt;/strong&gt;&lt;p&gt;&lt;/p&gt;';answer.querySelector('strong').textContent=title;answer.querySelector('p').textContent=body;
  });
