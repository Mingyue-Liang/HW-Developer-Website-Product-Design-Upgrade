&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },

      throw persistenceError();
    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      visualizationTheme: theme,
      widgetState: state,
      statePersistence,

    };

      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                  pending.resolve();
                } else {

                }

        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    }

      return;
    }

        id = decodeURIComponent(href.slice(1));

      }

        target == null ||

  syncTheme();
})();

          &lt;p class=&quot;h-article-body&quot;&gt;目前已上线 HarmonyOS 应用开发者能力认证、应用市场增长优化师认证等证书，助力开发者职业进阶。&lt;/p&gt;
          &lt;div class=&quot;h-ime-article&quot; hidden&gt;&lt;h2&gt;适用场景&lt;/h2&gt;&lt;p&gt;IME Kit 用于连接应用中的编辑框与输入法应用。开发者可据此开发输入法应用、自绘编辑框，或在应用中管理软键盘的显示与切换。&lt;/p&gt;&lt;h2&gt;能力与 API&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;输入法服务：&lt;/strong&gt;面向输入法应用，涉及软键盘面板、文本插入与删除、选区及输入事件。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;输入法框架：&lt;/strong&gt;面向使用输入法的应用或自绘编辑框，负责绑定输入法并处理输入、光标与键盘控制。&lt;/p&gt;&lt;h2&gt;IME Kit API参考&lt;/h2&gt;&lt;p&gt;常见入口包括 &lt;code&gt;inputMethodEngine&lt;/code&gt;、&lt;code&gt;inputMethod&lt;/code&gt;、&lt;code&gt;InputMethodExtensionAbility&lt;/code&gt;、&lt;code&gt;InputMethodExtensionContext&lt;/code&gt; 与 &lt;code&gt;Panel&lt;/code&gt;。具体接口的起始版本、支持设备及调用条件应以对应 API 页面为准。&lt;/p&gt;&lt;p class=&quot;h-article-note&quot;&gt;这里呈现的是用于交互演示的文章要点，不替代华为开发者文档的完整原文。&lt;a class=&quot;h-source-link&quot; href=&quot;https://developer.huawei.com/consumer/cn/doc/doccenter-capabilities/ime-kit-intro#ime-kit-api%E5%8F%82%E8%80%83&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;查看完整原文 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
          &lt;p class=&quot;h-article-note h-default-note&quot;&gt;此处仅展示截图中可见的文章摘要，用于演示 AI 助手与当前内容关联后的阅读体验。&lt;/p&gt;
        &lt;/article&gt;
        &lt;section class=&quot;h-video-view&quot; aria-label=&quot;视频课程学习页&quot; hidden&gt;
          &lt;button type=&quot;button&quot; class=&quot;h-video-back cursor-interaction&quot;&gt;← 返回搜索结果&lt;/button&gt;
          &lt;div class=&quot;h-video-crumb&quot;&gt;开发者学堂　›　视频课程　›　多端协同-手表协同&lt;/div&gt;
          &lt;div class=&quot;h-video-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;多端协同-手表协同&lt;/h1&gt;&lt;p&gt;边看边问，点击 AI 回答中的时间点，回到视频对应片段&lt;/p&gt;&lt;/div&gt;&lt;a href=&quot;https://developer.huawei.com/consumer/cn/training/course/slightMooc/C101791791116838222?choosedChapterIds=4ba50ca755ec40cdbd03b59bb8656fc6&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;查看官网课程 ↗&lt;/a&gt;&lt;/div&gt;
          &lt;div class=&quot;h-video-demo-note&quot;&gt;交互演示：尚未接入官网视频或字幕。下方画面、片段和时间点均为示意，不代表原课程内容。&lt;/div&gt;
          &lt;div class=&quot;h-video-stage&quot; role=&quot;group&quot; aria-label=&quot;示意视频播放器&quot;&gt;
            &lt;div class=&quot;h-video-visual&quot;&gt;&lt;div class=&quot;h-video-device h-video-phone&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;i&gt;手机&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;h-video-wave&quot; aria-hidden=&quot;true&quot;&gt;⌁　⌁　⌁&lt;/div&gt;&lt;div class=&quot;h-video-device h-video-watch&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;i&gt;手表&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;h-video-overlay-label&quot;&gt;多端协同 · 手表协同&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;h-video-center-play cursor-interaction&quot; aria-label=&quot;播放示意视频&quot;&gt;▶&lt;/button&gt;&lt;div class=&quot;h-video-caption&quot;&gt;示意片段：了解手机与手表协同的学习路径&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;h-video-controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;h-video-play cursor-interaction&quot; aria-label=&quot;播放示意视频&quot;&gt;▶&lt;/button&gt;&lt;span class=&quot;h-video-current&quot;&gt;00:00&lt;/span&gt;&lt;input type=&quot;range&quot; class=&quot;h-video-range cursor-interaction&quot; min=&quot;0&quot; max=&quot;1000&quot; value=&quot;0&quot; aria-label=&quot;视频播放进度&quot;&gt;&lt;span&gt;16:40&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;h-video-transcript-toggle cursor-interaction&quot;&gt;字幕与时间点&lt;/button&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;h-video-lower&quot;&gt;&lt;div class=&quot;h-video-meta&quot;&gt;&lt;strong&gt;课程学习内容&lt;/strong&gt;&lt;p&gt;观看视频时，AI 助手可概括当前片段、回答问题，并给出可点击的时间点。支持继续追问，也可切换语音交流。&lt;/p&gt;&lt;div class=&quot;h-video-chapters&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;0&quot;&gt;&lt;b&gt;00:00&lt;/b&gt;&lt;span&gt;课程导入&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;192&quot;&gt;&lt;b&gt;03:12&lt;/b&gt;&lt;span&gt;场景说明（示意）&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;438&quot;&gt;&lt;b&gt;07:18&lt;/b&gt;&lt;span&gt;开发流程（示意）&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;706&quot;&gt;&lt;b&gt;11:46&lt;/b&gt;&lt;span&gt;调试与验证（示意）&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;h-video-transcript&quot;&gt;&lt;strong&gt;片段索引&lt;/strong&gt;&lt;p&gt;选择片段可定位播放器，也会更新 AI 助手的当前学习上下文。&lt;/p&gt;&lt;div class=&quot;h-video-transcript-list&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;192&quot;&gt;&lt;time&gt;03:12&lt;/time&gt;&lt;span&gt;理解课程讨论的协同场景&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;438&quot;&gt;&lt;time&gt;07:18&lt;/time&gt;&lt;span&gt;按步骤梳理开发流程&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-seek=&quot;706&quot;&gt;&lt;time&gt;11:46&lt;/time&gt;&lt;span&gt;回看调试和验证部分&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;

          &lt;div class=&quot;h-context&quot;&gt;&lt;small&gt;当前内容&lt;/small&gt;&lt;strong class=&quot;h-context-title&quot;&gt;搜索：开发者能力认证&lt;/strong&gt;&lt;p class=&quot;h-context-desc&quot;&gt;打开文章后，助手会自动关联当前页面，提供针对性辅助阅读。&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;h-assistant-content&quot; aria-live=&quot;polite&quot;&gt;
            &lt;div class=&quot;h-welcome&quot;&gt;&lt;strong&gt;可以帮你做什么？&lt;/strong&gt;&lt;p&gt;基于搜索结果继续提问，或打开一篇文章开始辅助阅读。&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;h-search-field&quot;&gt;&lt;input class=&quot;h-search-input&quot; aria-label=&quot;搜索内容&quot; value=&quot;开发者能力认证&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;h-search-clear cursor-interaction&quot; aria-label=&quot;清除搜索内容&quot;&gt;×&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;h-ai-search-trigger cursor-interaction&quot; aria-label=&quot;AI搜索并打开AI助手&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i class=&quot;h-ai-sparkle&quot; data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;
